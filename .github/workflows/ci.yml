name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter quality and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.4
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --coverage --no-pub

      - name: Enforce line coverage floor
        run: dart run tool/check_coverage.dart coverage/lcov.info 30

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload coverage output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  functions:
    name: Cloud Functions checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Install Firestore rules test dependencies
        run: npm --prefix ../rules-tests ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14.27.0 --ignore-scripts

      - name: Run Functions emulator tests
        run: npm run test:emulator

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
