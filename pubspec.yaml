name: knz_scent_admin
description: KNZ Scent Admin Portal - Luxury Fragrance Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  crypto: ^3.0.5
  flutter:
    sdk: flutter

  # ── UI ────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.1.1
  fl_chart: ^0.70.2
  intl: ^0.20.1

  # ── Image ─────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # ── Local Database ────────────────────────────────────────────────────────
  sqflite: ^2.4.1
  path: ^1.9.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  http: ^1.4.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.3.2
  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.2
  firebase_crashlytics: ^4.3.3   # Error reporting for production builds

  # ── Notifications ──────────────────────────────────────────────────────────
  flutter_local_notifications: ^22.2.0   # Low-stock restock reminders

  # ── Bluetooth Printing ────────────────────────────────────────────────────
  flutter_blue_plus: ^1.35.5
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^12.0.0+1

  # ── Export (Soft-delete + Export update) ─────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0
  csv: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1   # Controls time in unit tests — no real-world delays
  sqflite_common_ffi: ^2.3.6
  flutter_launcher_icons: ^0.13.1   # App icon generator
 
# ── App Icon Configuration ────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_fitted.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
 

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
